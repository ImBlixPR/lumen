[project]
name = "lumen"
version = "0.1.0"
description = "Audiobook player with an offline, translated, always-on-top subtitle overlay"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT (app code). Models and fonts carry their own licenses, see README." }
dependencies = [
    "pyside6>=6.9,<6.12",
    "faster-whisper==1.2.1",
    "ctranslate2>=4.5,<5",
    "sentencepiece>=0.2",
    "huggingface-hub>=0.24",
    "av>=12",
    "mutagen>=1.47",
    "platformdirs>=4",
]

[project.optional-dependencies]
# CUDA 12 runtime libraries for CTranslate2 (NVIDIA GPUs). CPU works without this extra.
gpu = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
]

[project.scripts]
lumen = "lumen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
